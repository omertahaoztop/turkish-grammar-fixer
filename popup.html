<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Türkçe Yazım Düzeltici</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="popup-header">
      <span class="logo">✏️</span>
      <div>
        <strong>Türkçe Yazım Düzeltici</strong>
        <p class="tagline">TDK yazım kuralları ile</p>
      </div>
    </div>

    <div class="status-row" id="status-row">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Kontrol ediliyor...</span>
    </div>

    <div class="divider"></div>

    <div class="instructions">
      <div class="step">
        <span class="step-num">1</span>
        <span>Metni seç veya yazı alanına tıkla</span>
      </div>
      <div class="step">
        <span class="step-num">2</span>
        <span>Sağ tıkla → <em>"Türkçe yazımı düzelt"</em></span>
      </div>
      <div class="step">
        <span class="step-num">3</span>
        <span>Hataları gör ve düzeltilmiş metni uygula</span>
      </div>
    </div>

    <div class="divider"></div>

    <div class="footer-actions">
      <button id="open-settings" class="btn-settings">⚙️ Ayarlar</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
